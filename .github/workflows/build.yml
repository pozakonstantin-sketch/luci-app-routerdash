name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: python3 package/build-apk.py

      - name: Show package info
        run: |
          ls -l package/dist/
          sha256sum package/dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-routerdash
          path: package/dist/*.apk
          if-no-files-found: error
